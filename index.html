<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8">

<style>
/* Tema escuro fixo (cabine e escritório). Coluna única no celular, grade no computador. */
:root{
  --bg:#0c1116; --panel:#141b22; --panel2:#1b242d; --line:#27333f; --fg:#e7edf3; --mut:#8a9aaa; --dim:#5d6c7a;
  --acc:#f5b33c; --accInk:#1a1204; --ok:#3ecf8e; --bad:#f26d6d; --info:#5aa9f0; --warn:#ff7a45;
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --fb:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--fb);font-size:14px;line-height:1.45;padding:0 max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--fd);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:17px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:12px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .logo{width:30px;height:30px;border-radius:7px;background:var(--acc);display:grid;place-items:center}
.brand h1{font-size:22px;line-height:1}
.brand small{display:block;font-family:var(--fb);font-weight:500;font-size:11px;color:var(--mut)}
nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
nav.tabs button{color:var(--mut);background:transparent;border:0;padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px;white-space:nowrap;min-height:34px}
nav.tabs button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}
main{max-width:1240px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-family:var(--fd);font-size:30px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi.ok b{color:var(--ok)} .kpi.bad b{color:var(--bad)} .kpi.acc b{color:var(--acc)} .kpi.info b{color:var(--info)}
button,.btn{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
button:hover,.btn:hover{border-color:var(--mut)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
button.ok{background:var(--ok);color:#06210f;border-color:var(--ok)}
button.bad{background:transparent;color:var(--bad);border-color:#5a2a2a}
button.big{font-size:20px;font-family:var(--fd);letter-spacing:.04em;min-height:64px;width:100%;border-radius:12px}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#1f5b41} .pill.bad{color:var(--bad);border-color:#5a2a2a} .pill.acc{color:var(--acc);border-color:#5c4416} .pill.info{color:var(--info);border-color:#22415f}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.banner{border:1px dashed var(--acc);color:var(--acc);border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px}
.note{background:var(--panel2);border-radius:10px;padding:12px 14px;color:var(--mut);font-size:13px}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty h3{color:var(--fg);margin-bottom:6px}
.stop-now{border:1px solid var(--acc);background:linear-gradient(180deg,#1d1a12,var(--panel) 60%)}
.stop-now .ord{font-family:var(--fd);font-size:15px;color:var(--acc);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.stop-now .nm{font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.05;margin:4px 0 2px}
.timer{font-family:var(--fd);font-size:44px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1}
.photo-prev{width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#000}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.badge.ok{background:#123826;border-color:#1f5b41;color:var(--ok)} .badge.bad{background:#3a1717;border-color:#5a2a2a;color:var(--bad)}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.syncbar{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;margin-bottom:12px;border:1px solid var(--line);background:var(--panel)}
.syncbar .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.syncbar.pend .dot{background:var(--acc)} .syncbar.off .dot{background:var(--bad)}
.sres{border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;margin-top:6px}
.sres button{width:100%;justify-content:flex-start;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-align:left;min-height:44px;font-weight:500}
.gps{font-size:11px;font-weight:700}
.gps.r{color:var(--ok)} .gps.a{color:var(--info)} .gps.c{color:var(--acc)} .gps.n{color:var(--bad)}
.mini{min-height:32px;padding:4px 9px;font-size:12px}
.map{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:11px;font-family:var(--fb)}
.chart .gl{stroke:var(--line);stroke-width:1}
.hb{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .bar{height:12px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden}
.hb .bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:4px}
.hb .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--info)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;padding:0;display:block;text-align:left;min-height:0;font-weight:400;width:100%}
.cc .im{aspect-ratio:4/3;background:#000;display:grid;place-items:center;color:var(--dim);font-size:12px;max-width:100%}
.cc .im img{width:100%;height:100%;object-fit:cover}
.cc .tx{padding:10px 12px}
.lb{position:fixed;inset:0;background:rgba(5,8,11,.97);z-index:20;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);gap:10px}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain}
/* mapa das entregas */
.mapa-lb{padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);gap:8px;background:var(--bg)}
.mp-corpo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px;gap:10px}
#mpMapa{height:100%;min-height:0;border-radius:10px;border:1px solid var(--line);background:#0b0f13}
.mp-lista{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.mp-lista .it{cursor:pointer}
.mp-tempo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mp-tempo input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
@media(max-width:760px){.mp-corpo{grid-template-columns:1fr;grid-template-rows:1fr 36%}}
.mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px Inter,sans-serif;border:2px solid #0c1116;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.mk.ok{background:#3ecf8e;color:#06281a}.mk.pend{background:#f26d6d;color:#2a0707}
.mk.agora{background:#f5b33c;color:#1a1204;animation:pulso 1.4s infinite}.mk.prox{background:#f26d6d;color:#2a0707;border:3px solid #f5b33c}
.mk.oc{background:#3a3f46;color:#f26d6d;border-color:#f26d6d}.mk.aprox{border-style:dashed}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(245,179,60,.75)}70%{box-shadow:0 0 0 13px rgba(245,179,60,0)}100%{box-shadow:0 0 0 0 rgba(245,179,60,0)}}
.mk-cam{display:inline-flex;align-items:center;gap:4px;background:var(--c);color:#0c1116;border-radius:14px;padding:3px 8px 3px 5px;font:700 11px Inter,sans-serif;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.8)}
.mk-cam svg{width:16px;height:16px}
.mk-g{width:22px;height:22px;border-radius:5px;background:#e7edf3;color:#0c1116;display:grid;place-items:center;font:700 11px Inter,sans-serif;border:2px solid #0c1116}
.leaflet-container{font-family:var(--fb);background:#0b0f13}
.mp-tiles{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.6)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#141b22;color:#e7edf3;border:1px solid #27333f}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px;line-height:1.45}
.leaflet-control-attribution{background:rgba(12,17,22,.75)!important;color:#8a9aaa!important}.leaflet-control-attribution a{color:#8a9aaa!important}
.bol{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.login{max-width:380px;margin:8vh auto 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:32px;padding:4px 10px;font-size:12px}
.chips button.on{border-color:var(--acc);color:var(--acc)}
@media (max-width:640px){.stop-now .nm{font-size:26px}.kpi b{font-size:26px}.hide-m{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1204" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8" fill="#f5b33c"/><circle cx="17" cy="17.5" r="1.8" fill="#f5b33c"/></svg></div>
    <div><h1>Entregas Schuh</h1><small id="who">Controle de entregas e canhotos</small></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Seções" hidden></nav>
</header>
<main id="app"><div class="empty"><h3>Carregando…</h3></div></main>
<script>
window.onerror=function(m,s,l,c){ var a=document.getElementById("app"); if(a&&!window.__ok) a.innerHTML='<div class="card"><b>Erro ao abrir o app:</b> '+String(m).replace(/</g,"&lt;")+' (linha '+l+':'+c+')</div>'; };
</script>
<script>
"use strict";
/* ================= base ================= */
const HG = "https:"+"/"+"/"; // links montados sem barra dupla (o Google corta a linha)
const GARAGEM = {la:-27.8679, lo:-54.4291};
const VEL_KMH = 50, FATOR_ESTRADA = 1.3, PARADA_PADRAO_MIN = 15, RAIO_CLIENTE_M = 400;
const MOTIVOS = ["Cliente fechado","Recusou a mercadoria","Devolução total","Endereço não encontrado","Sem dinheiro / pagamento","Fora do horário de recebimento","Outro"];
const PROBLEMAS = ["Devolução parcial","Avaria","Falta de mercadoria","Troca","Outro"];
const S = {token:null, me:null, view:null, cli:[], cliMap:new Map(), cidades:{}, gerado:"", cfg:{placas:[],motoristas:[]},
  minhas:[], fila:[], online:navigator.onLine, sync:{rodando:false, erro:null, ultimo:null}, pos:null, gpsErro:null,
  rotasDia:[], rotasP:[], rast:null, fat:null, usuarios:[], periodo:30, demo:false,
  ed:null, rasc:[], form:{}, filt:{placa:"",mot:""}, busca:"", carregando:{}};
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => ymd(new Date());
const dBR = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "";
const hBR = iso => { if(!iso) return "—"; const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const dtBR = iso => { if(!iso) return "—"; const d=new Date(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+hBR(iso); };
const minEntre = (a,b) => (a&&b) ? (new Date(b)-new Date(a))/60000 : null;
const fmtMin = m => { if(m==null||!isFinite(m)) return "—"; m=Math.round(m); return m<60? m+" min" : Math.floor(m/60)+"h"+pad(m%60); };
const fmtN = (n,d=0) => (n==null||!isFinite(n)) ? "—" : n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (a,b) => b ? Math.round(100*a/b) : null;
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const nomeCli = p => p.fant || p.nome;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function hav(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLa=toR(b.la-a.la), dLo=toR(b.lo-a.lo);
  const h=Math.sin(dLa/2)**2+Math.cos(toR(a.la))*Math.cos(toR(b.la))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const kmRod = (a,b) => hav(a,b)*FATOR_ESTRADA;
const temLocal = p => p.la!=null && p.gps!=="n";
function navUrl(p){ return (p.gps==="r"||p.gps==="a") ? `${HG}www.google.com/maps/dir/?api=1&destination=${p.la},${p.lo}&travelmode=driving`
  : `${HG}www.google.com/maps/dir/?api=1&destination=${encodeURIComponent((p.end||"")+", "+(p.cid||"")+" - RS")}&travelmode=driving`; }

/* ================= servidor e memória do celular ================= */
const API_URL = HG+"script.google.com/macros/s/AKfycbwT_GVkeHik8yi8eEKK0QRCVmD4KzOYLiGwjvrP6KhEN2-DAIXz3vtzmwDl3T_r6pveRw/exec";
async function api(fn,...a){
  let resp;
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(), fn==="api_foto"?120000:45000);
  try{ resp=await fetch(API_URL,{method:"POST",body:JSON.stringify({fn,args:a}),signal:ctl.signal,redirect:"follow"}); }
  catch(e){ S.online=false; throw new Error("Sem conexão com o servidor"); }
  finally{ clearTimeout(tm); }
  let j; try{ j=await resp.json(); }catch(e){ throw new Error("Resposta inválida do servidor ("+resp.status+")"); }
  S.online=true;
  if(!j.ok){ const m=String(j.e||"Erro").replace(/^(Exception|Error|Erro):\s*/,""); if(m.includes("SESSAO")) sair(true); throw new Error(m); }
  return j.r;
}
const IDB = { db:null,
  abrir(){ return new Promise(res=>{ setTimeout(()=>res(false),2500); try{ const r=indexedDB.open("entregas_schuh",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>{IDB.db=r.result;res(true);}; r.onerror=()=>res(false); r.onblocked=()=>res(false);}catch(e){res(false);} }); },
  get(k){ return new Promise(res=>{ try{ const q=IDB.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined);}catch(e){ res(undefined);} }); },
  set(k,v){ return new Promise(res=>{ try{ const tx=IDB.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){ res(false);} }); },
  del(k){ return new Promise(res=>{ try{ const tx=IDB.db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){ res(false);} }); }
};

/* ================= login ================= */
async function boot(){
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  await IDB.abrir();
  S.token = await IDB.get("token"); S.me = await IDB.get("me");
  S.fila = (await IDB.get("fila")) || []; S.minhas = (await IDB.get("minhas")) || [];
  window.addEventListener("online",()=>{S.online=true; sincronizar(); render();});
  window.addEventListener("offline",()=>{S.online=false; render();});
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ sincronizar(); if(S.view==="motorista") atualizarMinhas(); } });
  setInterval(()=>{ sincronizar(); },25000);
  if(!S.token){ S.view="login"; render(); return; }
  entrouOk();
  api("api_me",S.token).then(me=>{ S.me=me; IDB.set("me",me); montarAbas(); render(); }).catch(()=>{});
}
function entrouOk(){
  $("#who").textContent = S.me ? `${S.me.nome} · ${S.me.perfil==="GESTOR"?"Gestão":"Motorista"}` : "";
  S.view = S.view && S.view!=="login" ? S.view : "motorista";
  montarAbas(); render();
  iniciarGps(); atualizarMinhas(); sincronizar();
  if(S.me&&S.me.perfil==="GESTOR"){ carregarBaseGestor(); }
}
function montarAbas(){
  const t=$("#tabs"); if(!S.me){ t.hidden=true; return; }

  t.innerHTML = abas.map(([v,n])=>`<button data-tab="${v}" class="${S.view===v?"on":""}">${n}</button>`).join(""); t.hidden=false;
}

async function entrar(){
  const u=$("#lgUser").value.trim(), p=$("#lgPin").value.trim(); S.lgUser=u;
  if(!u||!p){ toast("Informe usuário e PIN."); return; }
  S.entrando=true; render();
  try{ const r=await api("api_login",u,p,navigator.userAgent.slice(0,110)); S.token=r.token; S.me={login:r.login,nome:r.nome,perfil:r.perfil};
    await IDB.set("token",S.token); await IDB.set("me",S.me); if(r.primeiro) toast("PIN criado. Guarde-o: ele é o seu acesso.");
    S.entrando=false; S.view=null; entrouOk();
  }catch(e){ S.entrando=false; render(); toast(e.message); }
}
async function sair(forcado){
  if(!forcado && S.fila.length){ if(!S.confSair){ S.confSair=true; toast(`Há ${S.fila.length} registro(s) ainda não enviados. Toque em Sair de novo para sair mesmo assim.`); setTimeout(()=>S.confSair=false,6000); return; } }
  if(!forcado && S.token) api("api_sair",S.token).catch(()=>{});
  S.token=null; S.me=null; await IDB.del("token"); await IDB.del("me");
  if(forcado) toast("Seu acesso expirou ou foi bloqueado. Entre de novo.");
  S.view="login"; montarAbas(); $("#who").textContent="Controle de entregas e canhotos"; render();
}

/* ================= regra dos eventos (igual ao servidor) ================= */
function aplicarEvento(r, ev){
  r.evs = r.evs || [];
  // posição do caminhão (celular do motorista): 'pos' = envio periódico; qualquer evento com GPS também atualiza
  if(ev.gps && ev.gps.la!=null && (!r.pos || ev.ts>r.pos.ts)) r.pos={la:ev.gps.la,lo:ev.gps.lo,acc:ev.gps.acc,ts:ev.ts};
  if(ev.tipo==="pos") return true;
  if(r.evs.indexOf(ev.id)>=0) return false;
  const p = ev.k ? r.paradas.find(x=>x.k===ev.k) : null;
  const feitas = r.paradas.filter(x=>x.st==="ok"||x.st==="oc").length;
  if(ev.tipo==="iniciar"){ if(!r.ini){ r.ini=ev.ts; r.st="and"; r.kmIni=ev.km||null; } }
  else if(ev.tipo==="finalizar"){ r.fim=ev.ts; r.st="fim"; r.kmFim=ev.km||null; }
  else if(ev.tipo==="cheguei"){ if(p&&p.st==="pend"){ p.st="cli"; p.cheg=ev.ts; if(ev.gps) p.gpsCheg=ev.gps; } }
  else if(ev.tipo==="depois"){ if(p&&p.st==="pend"){ r.paradas.splice(r.paradas.indexOf(p),1); r.paradas.push(p); } }
  else if(ev.tipo==="concluir"||ev.tipo==="ocorrencia"){
    if(p&&p.st!=="ok"&&p.st!=="oc"){ if(!p.cheg) p.cheg=ev.ts; p.said=ev.ts; p.ordReal=feitas+1; if(ev.gps) p.gpsSaida=ev.gps; if(!r.ini){ r.ini=p.cheg; r.st="and"; }
      if(ev.tipo==="concluir"){ p.st="ok"; p.receb=ev.receb||""; if(ev.prob) p.prob=ev.prob; p.fotoPend=!!ev.temFoto; }
      else { p.st="oc"; p.oc=ev.oc||{tipo:"Outro",obs:""}; p.fotoPend=!!ev.temFoto; } } }
  else if(ev.tipo==="foto"){ if(p){ if(ev.campo==="oc") p.fotoOc=ev.fotoId; else p.canhoto=ev.fotoId; p.fotoPend=false; } }
  r.evs.push(ev.id); return true;
}

/* ================= motorista: dados, fila e GPS ================= */
async function atualizarMinhas(){
  if(!S.token) return;
  try{ const srv=await api("api_minhasRotas",S.token); juntarServidor(srv,true); }catch(e){ /* sem sinal: segue com o que está no celular */ }
}
function juntarServidor(lista, completa){
  const pend = S.fila.filter(j=>j.tipo!=="foto");
  const mapa = new Map(S.minhas.map(r=>[r.id,r]));
  if(completa){ const ids=new Set(lista.map(r=>r.id)); [...mapa.keys()].forEach(id=>{ if(!ids.has(id) && !pend.some(e=>e.rotaId===id)) mapa.delete(id); }); }
  lista.forEach(r=>{ r.evs=[]; pend.filter(e=>e.rotaId===r.id).forEach(e=>aplicarEvento(r,e)); mapa.set(r.id,r); });
  S.minhas=[...mapa.values()].filter(r=>r.data===hoje() || pend.some(e=>e.rotaId===r.id));
  IDB.set("minhas",S.minhas); if(S.view==="motorista") render();
}
async function salvarLocal(){ await IDB.set("fila",S.fila); await IDB.set("minhas",S.minhas); }
async function sincronizar(){
  if(S.sync.rodando||!S.token||!S.fila.length) return; S.sync.rodando=true; S.sync.erro=null; barraSync();
  try{
    while(S.fila.length){
      const j=S.fila[0];
      if(j.tipo==="foto"){
        const dataUrl=await IDB.get("foto_"+j.id);
        if(dataUrl){ const fid=await api("api_foto",S.token,j.meta,dataUrl);
          const r=await api("api_sync",S.token,[{id:j.id,tipo:"foto",rotaId:j.rotaId,k:j.k,campo:j.campo,fotoId:fid,ts:j.ts}]);
          await IDB.del("foto_"+j.id); S.fila.shift(); await salvarLocal(); juntarServidor(Object.values(r),false);
        } else { S.fila.shift(); await salvarLocal(); }
      } else {
        const lote=[]; for(const x of S.fila){ if(x.tipo==="foto"||lote.length>=20) break; lote.push(x); }
        const r=await api("api_sync",S.token,lote);
        S.fila.splice(0,lote.length); await salvarLocal(); juntarServidor(Object.values(r),false);
      }
    }
    S.sync.ultimo=new Date().toISOString();
  }catch(e){ S.sync.erro=e.message; if(/não é sua|bloque/i.test(e.message)) toast(e.message); }
  finally{ S.sync.rodando=false; barraSync(); }
}
function barraSync(){ const el=$("#syncbar"); if(el) el.outerHTML=htmlSync(); }
function htmlSync(){
  const fotos=S.fila.filter(j=>j.tipo==="foto").length, regs=S.fila.filter(j=>j.tipo!=="foto"&&j.tipo!=="pos").length;
  let cls="", txt="Tudo enviado";
  if(S.fila.length){ cls = (S.online&&!S.sync.erro)?"pend":"off";
    txt = `${regs?regs+" registro(s)":""}${regs&&fotos?" e ":""}${fotos?fotos+" foto(s)":""} guardados no celular · ${S.sync.rodando?"enviando…":(S.online&&!S.sync.erro?"envio em instantes":"envia sozinho quando tiver sinal")}`; }
  else if(!S.online){ cls="off"; txt="Sem sinal — pode continuar trabalhando, tudo fica guardado"; }
  const gps = S.pos ? `GPS ok (±${Math.round(S.pos.acc)} m)` : (S.gpsErro? "GPS desligado" : "GPS buscando…");
  return `<div id="syncbar" class="syncbar ${cls}"><span class="dot"></span><span class="grow">${esc(txt)}</span><span class="dim">${esc(gps)}</span>${S.fila.length&&S.online&&!S.sync.rodando?`<button class="mini" data-a="enviarJa">Enviar agora</button>`:""}</div>`;
}
let gpsWatch=null;
function iniciarGps(){
  if(gpsWatch!==null||!navigator.geolocation) { if(!navigator.geolocation) S.gpsErro="sem GPS"; return; }
  try{ gpsWatch=navigator.geolocation.watchPosition(p=>{ S.pos={la:+p.coords.latitude.toFixed(6),lo:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),t:Date.now()}; S.gpsErro=null; },
    e=>{ S.gpsErro=e.message||"negado"; }, {enableHighAccuracy:true,maximumAge:60000,timeout:30000}); }catch(e){ S.gpsErro="indisponível"; }
}
const posAtual = () => (S.pos && Date.now()-S.pos.t<180000) ? {la:S.pos.la,lo:S.pos.lo,acc:S.pos.acc} : null;

/* ================= MOTORISTA ================= */
function rotasHoje(){ return S.minhas.filter(r=>r.data===hoje()); }
function rotaSel(){ const l=rotasHoje(); return l.find(r=>r.id===S.rotaSel) || (l.length===1?l[0]:null); }
function paradaAtual(r){ return r.paradas.find(p=>p.st==="cli") || r.paradas.find(p=>p.st==="pend"); }
function vMotorista(){
  let h=htmlSync();
  const l=rotasHoje();
  if(!l.length) return h+`<div class="card empty"><h3>Nenhuma rota sua para hoje (${dBR(hoje())})</h3><p>Quando a logística salvar a rota, ela aparece aqui. Abra o app com Wi-Fi na garagem para baixar a rota do dia.</p><button data-a="recarregar">Procurar de novo</button></div>`;
  const r=rotaSel();
  if(l.length>1||!r) h+=`<div class="card row" style="margin-bottom:14px"><label class="f grow"><span class="lbl">Rota de hoje</span>
    <select id="selRota"><option value="">Escolha…</option>${l.map(x=>`<option value="${esc(x.id)}" ${r&&r.id===x.id?"selected":""}>${esc(x.placa)} · ${esc(x.mot||"")} · ${x.paradas.length} entregas</option>`).join("")}</select></label></div>`;
  if(!r) return h;
  const tot=r.paradas.length, feitas=r.paradas.filter(p=>p.st==="ok"||p.st==="oc").length;
  h+=`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><span class="lbl">${esc(r.placa)} · ${esc(r.mot||"")}</span><h2 class="num">${feitas} de ${tot} entregas</h2></div>
    <div class="row small mut"><span>${fmtN(r.kmPlan)} km previstos</span><span>Retorno previsto ${hBR(r.retornoPrev)}</span>${r.ini?`<span>Saiu ${hBR(r.ini)}</span>`:""}</div></div>
    <div class="prog" style="margin-top:10px"><i style="width:${pct(feitas,tot)||0}%"></i></div></div>`;
  if(r.st==="fim") return h+`<div class="card empty"><h3>Rota finalizada às ${hBR(r.fim)}</h3><p>Jornada de ${fmtMin(minEntre(r.ini,r.fim))}. Bom descanso!</p></div>`+listaParadas(r);
  if(!r.ini) return h+`<div class="card grid"><h3>Antes de sair da garagem</h3><label class="f"><span class="lbl">Km do odômetro (opcional)</span><input id="kmIni" inputmode="numeric" placeholder="Ex.: 154320"></label>
    <button class="big pri" data-a="iniciar">INICIAR ROTA</button></div>`+listaParadas(r);
  const p=paradaAtual(r);
  if(!p) return h+`<div class="card grid"><h3>Todas as entregas registradas</h3><label class="f"><span class="lbl">Km do odômetro na chegada (opcional)</span><input id="kmFim" inputmode="numeric"></label>
    <button class="big pri" data-a="finalizar">FINALIZAR ROTA (CHEGUEI NA GARAGEM)</button></div>`+listaParadas(r);
  return h+cartaoParada(r,p)+listaParadas(r);
}
function cartaoParada(r,p){
  const ordem=r.paradas.indexOf(p)+1, f=S.form[p.k]||{};
  let h=`<div class="card stop-now grid" style="margin-bottom:14px"><div><div class="ord">Parada ${ordem} de ${r.paradas.length}${p.prev?` · previsto ${hBR(p.prev)}`:""}</div>
    <div class="nm">${esc(nomeCli(p))}</div><div class="mut">${esc(p.nome)} · cód. ${esc(p.cod)}</div>
    <div style="margin-top:6px">${esc(p.end)} — <b>${esc(p.cid)}</b></div>
    <div class="row small mut" style="margin-top:6px">${p.nf?`<span class="pill">NF ${esc(p.nf)}</span>`:""}${p.vol?`<span class="pill">${esc(p.vol)} vol.</span>`:""}${p.valor?`<span class="pill">R$ ${esc(p.valor)}</span>`:""}${p.tm?`<span>Costuma levar ${p.tm} min neste cliente</span>`:""}</div></div>`;
  if(p.st==="pend" && f.modo!=="oc"){
    h+=`<div class="row"><a class="btn" style="flex:1" href="${navUrl(p)}" target="_blank" rel="noopener">Abrir no mapa</a><button style="flex:1" data-a="depois" data-k="${p.k}">Fazer depois</button></div>
      <button class="big pri" data-a="cheguei" data-k="${p.k}">CHEGUEI</button>
      <button class="ghost small" data-a="naoEntregue" data-k="${p.k}">Não consegui entregar</button>`;
  } else if(p.st==="pend"){ h+=formOcorrencia(p,f); }
  else {
    h+=`<div><span class="lbl">No cliente desde ${hBR(p.cheg)}</span><div class="timer" id="timer" data-ini="${esc(p.cheg)}">00:00</div></div>`;
    if(f.modo==="oc") h+=formOcorrencia(p,f);
    else h+=`<div class="grid" style="gap:8px"><span class="lbl">Canhoto assinado pelo cliente (obrigatório)</span>
        ${f.url?`<img class="photo-prev" src="${f.url}" alt="Foto do canhoto">`:""}
        <button class="${f.url?"":"pri"}" data-a="foto" data-k="${p.k}" style="min-height:56px">${f.url?"Tirar outra foto":"FOTOGRAFAR CANHOTO"}</button>
        <label class="f"><span class="lbl">Quem recebeu</span><input id="receb" value="${esc(f.receb||"")}" placeholder="Nome de quem assinou"></label>
        <label class="row small"><input type="checkbox" id="temProb" ${f.prob?"checked":""} style="min-height:auto"> Entrega com problema (devolução parcial, avaria, falta…)</label>
        ${f.prob?`<div class="grid" style="gap:8px"><select id="probTipo">${PROBLEMAS.map(x=>`<option ${f.probTipo===x?"selected":""}>${x}</option>`).join("")}</select><textarea id="probObs" placeholder="O que aconteceu? Itens e quantidades">${esc(f.probObs||"")}</textarea></div>`:""}
        <button class="big ok" data-a="concluir" data-k="${p.k}" ${f.dataUrl?"":"disabled"}>CONCLUIR ENTREGA</button>
        <button class="ghost small" data-a="naoEntregue" data-k="${p.k}">Não consegui entregar</button></div>`;
  }
  return h+`</div>`;
}
function formOcorrencia(p,f){
  return `<div class="grid" style="gap:8px;border-top:1px solid var(--line);padding-top:12px"><span class="lbl">Por que não foi entregue?</span>
    <select id="ocTipo">${MOTIVOS.map(x=>`<option ${f.ocTipo===x?"selected":""}>${x}</option>`).join("")}</select>
    <textarea id="ocObs" placeholder="Detalhes (com quem falou, horário de recebimento…)">${esc(f.ocObs||"")}</textarea>
    ${f.url?`<img class="photo-prev" src="${f.url}" alt="Foto da ocorrência">`:""}
    <button data-a="foto" data-k="${p.k}">${f.url?"Tirar outra foto":"Foto da fachada / comprovante (opcional)"}</button>
    <div class="row"><button class="ghost" style="flex:1" data-a="cancelaOc" data-k="${p.k}">Voltar</button><button class="pri" style="flex:2" data-a="registrarOc" data-k="${p.k}">Registrar e seguir</button></div></div>`;
}
function listaParadas(r){
  return `<div class="card"><h3 style="margin-bottom:6px">Roteiro do dia</h3><div class="list">${r.paradas.map((p,i)=>{
    const cls=p.st==="ok"?"ok":p.st==="oc"?"bad":"";
    const info=p.st==="ok"?`Entregue ${hBR(p.said)} · ${fmtMin(minEntre(p.cheg,p.said))} no cliente${p.fotoPend?" · foto aguardando sinal":""}`:p.st==="oc"?`${esc(p.oc?.tipo||"Ocorrência")} · ${hBR(p.said)}`:p.st==="cli"?`No cliente desde ${hBR(p.cheg)}`:`Previsto ${hBR(p.prev)}`;
    return `<div class="it"><span class="badge ${cls}">${i+1}</span><div class="grow"><div class="ell"><b>${esc(nomeCli(p))}</b> <span class="mut">· ${esc(p.cid)}</span></div><div class="small mut">${info}${p.nf?` · NF ${esc(p.nf)}`:""}</div></div></div>`; }).join("")}</div></div>`;
}
function novoEvento(r,tipo,extra){
  const ev=Object.assign({id:uid(),tipo,rotaId:r.id,ts:new Date().toISOString(),gps:posAtual()},extra||{});
  aplicarEvento(r,ev); S.fila.push(ev); return ev;
}
async function acaoMotorista(a,k,btn){
  if(a==="recarregar"){ atualizarMinhas(); toast("Procurando rotas…"); return; }
  if(a==="enviarJa"){ S.sync.erro=null; sincronizar(); return; }
  const r=rotaSel(); if(!r) return;
  const p=k?r.paradas.find(x=>x.k===k):null; const f=k?(S.form[k]||(S.form[k]={})):{};
  if(a==="iniciar"){ novoEvento(r,"iniciar",{km:$("#kmIni")?.value.trim()||null}); }
  else if(a==="finalizar"){ novoEvento(r,"finalizar",{km:$("#kmFim")?.value.trim()||null}); }
  else if(a==="cheguei"){ novoEvento(r,"cheguei",{k}); }
  else if(a==="depois"){ novoEvento(r,"depois",{k}); toast("Movida para o fim do roteiro"); }
  else if(a==="naoEntregue"){ f.modo="oc"; f.url=null; f.dataUrl=null; render(); return; }
  else if(a==="cancelaOc"){ f.modo=null; f.url=null; f.dataUrl=null; render(); return; }
  else if(a==="foto"){ lerCampos(k); abrirCamera(k); return; }
  else if(a==="concluir"||a==="registrarOc"){
    if(a==="concluir"&&!f.dataUrl){ toast("Fotografe o canhoto para concluir."); return; }
    lerCampos(k);
    const temFoto=!!f.dataUrl, campo=a==="concluir"?"canhoto":"oc";
    const ev = a==="concluir" ? novoEvento(r,"concluir",{k,receb:f.receb||"",prob:f.prob?{tipo:f.probTipo||PROBLEMAS[0],obs:f.probObs||""}:null,temFoto})
                              : novoEvento(r,"ocorrencia",{k,oc:{tipo:f.ocTipo||MOTIVOS[0],obs:f.ocObs||""},temFoto});
    if(temFoto){ const fid="F"+ev.id; await IDB.set("foto_"+fid,f.dataUrl);
      S.fila.push({id:fid,tipo:"foto",rotaId:r.id,k,campo,ts:ev.ts,meta:{evId:fid,rotaId:r.id,k,campo,data:r.data,placa:r.placa,nf:p.nf||"",cod:p.cod,cliente:nomeCli(p),ts:ev.ts}}); }
    if(f.url) URL.revokeObjectURL(f.url); delete S.form[k];
    toast(a==="concluir"?"Entrega concluída. Próxima liberada.":"Ocorrência registrada. Próxima liberada.");
  } else return;
  await salvarLocal(); render(); sincronizar();
}
function lerCampos(k){ const f=S.form[k]; if(!f) return;
  const g=id=>{const el=$("#"+id); return el?el.value:undefined;};
  ["receb","probTipo","probObs","ocTipo","ocObs"].forEach(id=>{ const v=g(id); if(v!==undefined) f[id]=v; }); }
/* câmera dentro do app: a foto vai direto para a memória do app (nunca para a galeria) e é apagada depois do envio */
let camStream=null;
async function abrirCamera(k){
  S.fotoK=k; S.camTmp=null;
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ toast("Este navegador não libera a câmera. Use o Chrome atualizado."); return; }
  const d=document.createElement("div"); d.className="lb"; d.id="camBox";
  d.innerHTML=`<div class="row" style="justify-content:space-between"><b>Enquadre o canhoto inteiro, com a assinatura legível</b><button data-cam="fechar">Cancelar</button></div>
    <video id="camV" playsinline autoplay muted style="flex:1;min-height:0;width:100%;object-fit:contain;background:#000;border-radius:10px"></video>
    <img id="camI" alt="Foto tirada" hidden style="flex:1;min-height:0;width:100%;object-fit:contain">
    <div class="row" id="camBtns"><button class="big pri" data-cam="capturar">CAPTURAR</button></div>`;
  document.body.appendChild(d);
  try{
    camStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1440}}});
    const v=$("#camV"); if(!v){ fecharCamera(); return; } v.srcObject=camStream;
  }catch(e){ fecharCamera(); toast(e&&e.name==="NotAllowedError"?"Libere a câmera para o app (cadeado ao lado do endereço > Câmera > Permitir).":"Não consegui abrir a câmera: "+((e&&e.message)||e)); }
}
function fecharCamera(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } const b=$("#camBox"); if(b) b.remove(); }
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-cam]"); if(!b) return; ev.stopPropagation(); const a=b.dataset.cam;
  if(a==="fechar"){ S.camTmp=null; fecharCamera(); }
  else if(a==="capturar"){ const v=$("#camV"); if(!v||!v.videoWidth){ toast("Aguarde a câmera abrir."); return; }
    const s=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement("canvas");
    c.width=Math.round(v.videoWidth*s); c.height=Math.round(v.videoHeight*s); c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    S.camTmp=c.toDataURL("image/jpeg",0.75); $("#camI").src=S.camTmp; $("#camI").hidden=false; v.hidden=true;
    $("#camBtns").innerHTML=`<button class="grow" data-cam="refazer" style="min-height:56px">Tirar de novo</button><button class="pri grow" data-cam="usar" style="min-height:56px">Usar esta foto</button>`; }

function paradaDeCliente(c){
  const p={k:uid(),cod:c.c,nome:c.n,fant:c.f,cid:c.ci,end:c.e,nf:"",vol:"",valor:"",st:"pend"};
  if(c.la!=null){ p.la=c.la; p.lo=c.lo; p.gps=c.app?"a":"r"; p.tm=c.t||null; }
  else if(S.cidades[c.ci]){ p.la=S.cidades[c.ci][0]; p.lo=S.cidades[c.ci][1]; p.gps="c"; }
  else p.gps="n";
  return p;
}
function pt(p){ return temLocal(p)?{la:p.la,lo:p.lo}:GARAGEM; }
function custoRota(ps){ let km=0,cur=GARAGEM; ps.forEach(p=>{const x=pt(p); km+=kmRod(cur,x); cur=x;}); return km+kmRod(cur,GARAGEM); }
function otimizar(ps){
  const fixos=ps.filter(p=>p.st!=="pend"), livres=ps.filter(p=>p.st==="pend");
  if(livres.length<3) return [...fixos,...livres];
  const start=fixos.length?pt(fixos[fixos.length-1]):GARAGEM;
  let rest=[...livres], ord=[], cur=start;
  while(rest.length){ let bi=0,bd=1e9; rest.forEach((p,i)=>{const d=temLocal(p)?kmRod(cur,p):5e8; if(d<bd){bd=d;bi=i;}}); const p=rest.splice(bi,1)[0]; ord.push(p); if(temLocal(p)) cur=pt(p); }
  const P=[start,...ord.map(pt),GARAGEM], idx=P.map((_,i)=>i), d=(i,j)=>kmRod(P[idx[i]],P[idx[j]]);
  let mel=true,it=0;
  while(mel&&it<80){ mel=false; it++; for(let i=1;i<idx.length-2;i++) for(let j=i+1;j<idx.length-1;j++){ if(d(i-1,i)+d(j,j+1)>d(i-1,j)+d(i,j+1)+1e-9){ const seg=idx.slice(i,j+1).reverse(); idx.splice(i,j-i+1,...seg); mel=true; } } }
  return [...fixos,...idx.slice(1,-1).map(i=>ord[i-1])];
}
function previsoes(rota){
  const [hh,mm]=(rota.saidaPrev||"07:30").split(":").map(Number);
  const base=new Date(rota.data+"T00:00:00"); base.setHours(hh||7,mm||30,0,0);
  let t=base.getTime(),cur=GARAGEM,km=0;
  rota.paradas.forEach(p=>{ const x=temLocal(p)?pt(p):cur, k=kmRod(cur,x); km+=k; t+=k/VEL_KMH*3600000; p.prev=new Date(t).toISOString(); t+=Math.min(p.tm||PARADA_PADRAO_MIN,60)*60000; cur=x; });
  const kv=kmRod(cur,GARAGEM); km+=kv; t+=kv/VEL_KMH*3600000;
  rota.kmPlan=Math.round(km); rota.minPlan=Math.round((t-base.getTime())/60000); rota.retornoPrev=new Date(t).toISOString();
}
function dividir(ps, placas){
  // varredura angular a partir da garagem: fatias contíguas e equilibradas em tempo estimado
  const n=placas.length, com=ps.filter(temLocal), sem=ps.filter(p=>!temLocal(p));
  const ang=p=>Math.atan2(p.la-GARAGEM.la,(p.lo-GARAGEM.lo)*Math.cos(GARAGEM.la*Math.PI/180));
  const ord=[...com].sort((a,b)=>ang(a)-ang(b));
  let corte=0,gap=-1; for(let i=0;i<ord.length;i++){ const a=ang(ord[i]), b=i+1<ord.length?ang(ord[i+1]):ang(ord[0])+2*Math.PI; if(b-a>gap){gap=b-a;corte=i+1;} }
  const seq=[...ord.slice(corte),...ord.slice(0,corte),...sem];
  const peso=p=>(p.tm||PARADA_PADRAO_MIN)+hav(GARAGEM,pt(p))*0.6;
  const total=seq.reduce((s,p)=>s+peso(p),0), alvo=total/n; const grupos=placas.map(()=>[]); let g=0,acc=0;
  seq.forEach(p=>{ if(acc>=alvo&&g<n-1){g++;acc=0;} grupos[g].push(p); acc+=peso(p); });
  return grupos.map(x=>otimizar(x));
}

  else if(acabou) cam=Object.assign({},GARAGEM,{txt:`Voltou à garagem${r.fim?" às "+hBR(r.fim):""}`,est:false});

/* ================= análise ================= */
function achatar(rotas){
  const out=[];
  rotas.forEach(r0=>{
    const r={...r0,paradas:(r0.paradas||[]).map(p=>({...p}))};
    const feitas=r.paradas.filter(p=>p.cheg&&p.said).sort((a,b)=>new Date(a.cheg)-new Date(b.cheg));
    const ordemPlan=[...feitas].sort((a,b)=>(a.ordPlan||0)-(b.ordPlan||0)).map(p=>p.k);
    let ant=r.ini; feitas.forEach((p,i)=>{ p._desl=ant?minEntre(ant,p.cheg):null; ant=p.said; p._naOrdem=ordemPlan[i]===p.k; });
    r.paradas.forEach(p=>{ p._r=r; p._tcli=(p.cheg&&p.said)?minEntre(p.cheg,p.said):null;
      p._distM=(p.gpsCheg&&(p.gps==="r"||p.gps==="a"))?hav(p.gpsCheg,p)*1000:null; out.push(p); });
  });
  return out;
}
function filtrar(rotas){ return rotas.filter(r=>(!S.filt.placa||r.placa===S.filt.placa)&&(!S.filt.mot||r.mot===S.filt.mot)); }
function gerarDemo(){
  const loc=S.cli.filter(c=>c.la!=null); if(!loc.length) return [];
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const placas=["IXG7162","JDL0F02","IPB0479","IXW6936"], mots=["Motorista A (exemplo)","Motorista B (exemplo)","Motorista C (exemplo)","Motorista D (exemplo)"];
  const rotas=[]; const d=new Date(); d.setDate(d.getDate()-S.periodo+1);
  for(let i=0;i<S.periodo;i++){ const dia=new Date(d); dia.setDate(d.getDate()+i); if(dia.getDay()===0) continue; if(dia>new Date()) break;
    placas.forEach((pl,pi)=>{ if(dia.getDay()===6&&pi>1) return;
      const cen=loc[Math.floor(rnd()*loc.length)]; const perto=loc.map(c=>({c,d:hav(cen,c)+rnd()*15})).sort((a,b)=>a.d-b.d).slice(0,10+Math.floor(rnd()*12)).map(x=>x.c);
      const ps=otimizar(perto.map(paradaDeCliente)); const r={id:"demo"+i+pl,data:ymd(dia),placa:pl,mot:mots[pi],saidaPrev:"07:30",paradas:ps}; previsoes(r); ps.forEach((p,k)=>p.ordPlan=k+1);
      if(rnd()<.25){ const a=Math.floor(rnd()*ps.length), b=Math.floor(rnd()*ps.length); [ps[a],ps[b]]=[ps[b],ps[a]]; }
      let t=new Date(r.data+"T07:"+pad(20+Math.floor(rnd()*25))+":00").getTime(); r.ini=new Date(t).toISOString(); let cur=GARAGEM;
      ps.forEach((p,k)=>{ t+=kmRod(cur,p)/(42+rnd()*20)*3600000+rnd()*8*60000; p.cheg=new Date(t).toISOString(); p.gpsCheg={la:p.la+(rnd()-.5)*.002,lo:p.lo+(rnd()-.5)*.002,acc:15};
        t+=((p.tm||14)*(0.6+rnd()*0.9)+(rnd()<.07?40:0))*60000; p.said=new Date(t).toISOString(); p.ordReal=k+1;
        const x=rnd(); if(x<.05){p.st="oc";p.oc={tipo:MOTIVOS[Math.floor(rnd()*4)],obs:"exemplo"};} else {p.st="ok"; p.receb="exemplo"; if(x<.11) p.prob={tipo:PROBLEMAS[Math.floor(rnd()*3)],obs:"exemplo"}; p.nf=String(400000+Math.floor(rnd()*99999));} cur=p; });
      t+=kmRod(cur,GARAGEM)/50*3600000; r.fim=new Date(t).toISOString(); r.st="fim"; rotas.push(r); }); }
  return rotas;
}

function niceStep(max){ const r=max/4, p=Math.pow(10,Math.floor(Math.log10(r))), m=r/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function svgBarras(dados,series,opt={}){
  const W=640,H=opt.h||210,ml=34,mb=24,mt=10,mr=8, n=dados.length||1;
  const max=Math.max(1,...dados.map(d=>series.reduce((s,se)=>s+(d[se.k]||0),0))), passo=niceStep(max), top=Math.ceil(max/passo)*passo, bw=(W-ml-mr)/n;
  let g=""; for(let v=0;v<=top;v+=passo){ const y=H-mb-(v/top)*(H-mb-mt); g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text x="${ml-6}" y="${y+4}" text-anchor="end">${fmtN(v)}</text>`; }
  const every=Math.ceil(n/12);
  dados.forEach((d,i)=>{ let y0=H-mb; series.forEach(se=>{ const v=d[se.k]||0; if(!v) return; const h=(v/top)*(H-mb-mt); g+=`<rect x="${(ml+i*bw+bw*.15).toFixed(1)}" y="${(y0-h).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${se.c}"><title>${esc(d.l)}: ${fmtN(v)} ${esc(se.n)}</title></rect>`; y0-=h; });
    if(i%every===0) g+=`<text x="${(ml+i*bw+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function svgLinha(dados,cor,opt={}){
  const W=640,H=opt.h||210,ml=40,mb=24,mt=12,mr=12, vals=dados.map(d=>d.v).filter(v=>v!=null);
  if(!vals.length) return `<div class="empty small">Sem dados no período.</div>`;
  const max=Math.max(1,...vals,opt.ref||0), passo=niceStep(max), top=Math.ceil(max/passo)*passo, n=dados.length, x=i=>ml+(n<2?0.5:i/(n-1))*(W-ml-mr), y=v=>H-mb-(v/top)*(H-mb-mt);
  let g=""; for(let v=0;v<=top;v+=passo) g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-6}" y="${y(v)+4}" text-anchor="end">${fmtN(v)}</text>`;
  if(opt.ref) g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" stroke="#5aa9f0" stroke-dasharray="4 4"/><text x="${W-mr}" y="${y(opt.ref)-5}" text-anchor="end" style="fill:#5aa9f0">${esc(opt.refN)}</text>`;
  const pts=dados.map((d,i)=>d.v==null?null:[x(i),y(d.v)]).filter(Boolean);
  g+=`<path d="M${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L")}L${pts[pts.length-1][0].toFixed(1)},${H-mb}L${pts[0][0].toFixed(1)},${H-mb}Z" fill="${cor}" fill-opacity=".12"/><polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${cor}" stroke-width="2.2" stroke-linejoin="round"/>`;
  const lp=pts[pts.length-1]; g+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${cor}"/>`;
  const every=Math.ceil(n/12); dados.forEach((d,i)=>{ if(i%every===0) g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(d.l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function hbars(lista){
  if(!lista.length) return `<div class="empty small">Sem dados no período.</div>`;

}

/* ================= SEPARAÇÃO: pedidos do ERP (PDF) na ordem do roteiro ================= */
const LIB_PDFJS = HG+"cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const LIB_PDFJS_W = HG+"cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const LIB_PDFLIB = HG+"cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
const _libs = {};
function lib(src){ return _libs[src]||(_libs[src]=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>res(); s.onerror=()=>{ delete _libs[src]; rej(new Error("Não consegui carregar a leitura de PDF (sem internet?)")); }; document.head.appendChild(s); })); }
const normCid = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[.\-']/g," ").replace(/\s+/g," ").trim();
const numBR = s => Number(String(s||"").replace(/\./g,"").replace(",","."))||0;
async function linhasPagina(page){
  const tc=await page.getTextContent();
  const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({x:i.transform[4],y:i.transform[5],s:i.str}));
  its.sort((a,b)=>b.y-a.y||a.x-b.x); const L=[];
  its.forEach(i=>{ const l=L.find(z=>Math.abs(z.y-i.y)<3); if(l) l.it.push(i); else L.push({y:i.y,it:[i]}); });
  return L.sort((a,b)=>b.y-a.y).map(l=>l.it.sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim());
}
function lerCabecalho(ls){
  const t=ls.join("\n"), m=(re)=>{ const r=t.match(re); return r?r.slice(1):null; };
  const ped=m(/(\d{2}\/\d{2}\/\d{4})\s+(\d{4,})/), cli=m(/CLIENTE[.:\s]*(\d+)\s+(.*?)(?=\s+CNPJ|\s+CPF|\n|$)/), cid=m(/CIDADE[.:\s]*(.+?)\s+RS\b/);
  const fan=m(/FANTASIA[.:\s]*(.*?)(?=\s+IE[.:]|\n|$)/), tot=m(/TOTAL DO PEDIDO[.:\s]*([\d.]+,\d{2})/);
  const itens=ls.filter(l=>/^\d{1,6}\s+\d+(?:[.,]\d+)?\s+[A-Z]{1,3}\s+\S/.test(l)).length;
  return { data:ped&&ped[0], num:ped&&ped[1], cod:cli?Number(cli[0]):null, nome:cli?cli[1].trim():"", cid:cid?cid[0].trim():"", fant:fan?fan[0].trim():"", total:tot?numBR(tot[0]):null, itens };
}
async function lerPdfsSep(files){
  if(!S.cli.length){ toast("Aguarde carregar a base de clientes e tente de novo."); return; }
  S.sep={rotas:[],arqs:[],paradas:[],escolha:{},fora:[],ordem:S.sep?.ordem||"entrega",porRota:S.sep?S.sep.porRota!==false:true,lendo:true,saida:null}; render();
  try{
    await lib(LIB_PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc=LIB_PDFJS_W;
    for(const f of files){ const ai=S.sep.arqs.length;
      const buf=await f.arrayBuffer(); const doc=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
      const peds=[];
      for(let i=1;i<=doc.numPages;i++){ const h=lerCabecalho(await linhasPagina(await doc.getPage(i))); const ult=peds[peds.length-1];
        if(ult&&(!h.num||h.num===ult.num)){ ult.pags.push(i-1); ult.itens+=h.itens; if(h.total!=null) ult.total=h.total; continue; }
        peds.push({...h,pags:[i-1]}); }
      const porCli=new Map();
      peds.forEach(p=>{ const ch=p.cod!=null?"c"+p.cod:"n"+normCid(p.nome)+"|"+normCid(p.cid); if(!porCli.has(ch)) porCli.set(ch,[]); porCli.get(ch).push(p); });
      const cidN={}; Object.entries(S.cidades).forEach(([k,v])=>cidN[normCid(k)]=v);
      let paradas=[...porCli.values()].map(ps=>{ const h=ps[0], c=h.cod!=null&&S.cliMap.get(h.cod); let p;
        if(c){ p=paradaDeCliente(c); }
        else { p={k:uid(),cod:h.cod??"",nome:h.nome,fant:h.fant,cid:h.cid,end:"",nf:"",vol:"",valor:"",st:"pend",naoAchado:true}; const cc=cidN[normCid(h.cid)]; if(cc){ p.la=cc[0]; p.lo=cc[1]; p.gps="c"; } else p.gps="n"; }
        p.peds=ps; p.arq=ai; p.total=ps.reduce((s,x)=>s+(x.total||0),0); p.itens=ps.reduce((s,x)=>s+x.itens,0); return p; });
      paradas.filter(p=>!temLocal(p)).forEach(p=>{ const viz=paradas.find(q=>temLocal(q)&&normCid(q.cid)===normCid(p.cid)); if(viz){ p.la=viz.la; p.lo=viz.lo; p.gps="c"; } });
      S.sep.arqs.push({nome:f.name.replace(/\.pdf$/i,""),buf}); S.sep.paradas.push(...paradas);
    }
    agruparSep();
  }catch(e){ toast(e.message||String(e)); }
  S.sep.lendo=false; render();
}
/* rota de cada cliente: código fixo na rota > cidade de uma rota só > escolha do usuário > rota com mais cidades "certas" no lote */
function rotaDaParada(p,cert){
  const R=S.rotasFix||[], ck=normCid(p.cid);
  const porCli=R.find(r=>r.cl.includes(Number(p.cod))); if(porCli) return {rota:porCli.n,cand:[porCli.n]};
  const cand=R.filter(r=>r.ci.includes(ck)).map(r=>r.n);
  if(S.sep.escolha[ck]) return {rota:S.sep.escolha[ck],cand,amb:cand.length>1||!cand.length,escolhida:true};
  if(cand.length===1) return {rota:cand[0],cand};
  if(!cand.length) return {rota:"Sem rota: "+(p.cid||"?"),cand,amb:true,semRota:true};
  if(cert){ const best=cand.map(n=>[n,cert[n]||0]).sort((a,b)=>b[1]-a[1]); if(best[0][1]>0&&best[0][1]>(best[1]?.[1]||0)) return {rota:best[0][0],cand,amb:true,sugerida:true}; }
  if(S.sep.cidLote){ /* empate: a rota que cobre mais cidades deste PDF (ex.: São Borja + Itaqui -> "São Borja - Itaqui") */
    const best=cand.map(n=>[n,R.find(r=>r.n===n).ci.filter(c=>S.sep.cidLote.has(c)).length]).sort((a,b)=>b[1]-a[1]);
    if(best[0][1]>1&&best[0][1]>(best[1]?.[1]||0)) return {rota:best[0][0],cand,amb:true,sugerida:true}; }
  return {rota:null,cand,amb:true};
}
function agruparSep(){
  const sp=S.sep; sp.saida=null; const grupos=new Map(), add=(nome,p)=>{ if(!grupos.has(nome)) grupos.set(nome,[]); grupos.get(nome).push(p); };
  if(!sp.porRota||!(S.rotasFix||[]).length){ sp.amb=[]; sp.paradas.forEach(p=>add(sp.arqs[p.arq].nome,p)); }
  else {
    sp.cidLote=new Set(sp.paradas.map(p=>normCid(p.cid)));
    const cert={}; sp.paradas.forEach(p=>{ const x=rotaDaParada(p); if(!x.amb&&x.rota) cert[x.rota]=(cert[x.rota]||0)+1; });
    const amb=new Map();
    sp.paradas.forEach(p=>{ const x=rotaDaParada(p,cert); const ck=normCid(p.cid);
      if(x.amb){ const a=amb.get(ck)||{ck,cid:p.cid,cand:x.cand,rota:x.rota,n:0,sugerida:x.sugerida,semRota:x.semRota,escolhida:x.escolhida}; a.n++; amb.set(ck,a); }
      add(x.rota||"A definir",p); });
    sp.amb=[...amb.values()].sort((a,b)=>(a.rota?1:0)-(b.rota?1:0)||a.cid.localeCompare(b.cid));
  }
  const ant=new Map(sp.rotas.map(r=>[r.nome,r]));
  sp.rotas=[...grupos.entries()].filter(([n])=>!sp.fora.includes(n)).sort((a,b)=>(a[0]==="A definir")-(b[0]==="A definir")||a[0].localeCompare(b[0])).map(([nome,ps])=>{
    const velho=ant.get(nome); let ord;
    if(velho&&velho.paradas.length===ps.length&&ps.every(p=>velho.paradas.includes(p))) ord=velho.paradas; else ord=otimizar(ps);
    const peds=ps.reduce((s,p)=>s+p.peds.length,0), pags=ps.reduce((s,p)=>s+p.peds.reduce((t,x)=>t+x.pags.length,0),0);
    return {nome,paradas:ord,peds,paginas:pags,kmAntes:velho?velho.kmAntes:custoRota(ps),kmDepois:custoRota(ord)}; });
}
const latin = s => String(s??"").replace(/[–—]/g,"-").replace(/[^\x20-\x7E\xA0-\xFF]/g,"?");
async function gerarPdfSep(){
  const sp=S.sep; if(!sp||!sp.rotas.length) return; sp.gerando=true; render();
  try{
    await lib(LIB_PDFLIB); const {PDFDocument,StandardFonts,rgb}=PDFLib;
    const out=await PDFDocument.create(), F=await out.embedFont(StandardFonts.Helvetica), FB=await out.embedFont(StandardFonts.HelveticaBold);
    const carr=sp.ordem==="carregamento", agora=new Date();
    const srcs=[]; for(const a of sp.arqs) srcs.push(await PDFDocument.load(a.buf.slice(0)));
    for(const r of sp.rotas){
      const n=r.paradas.length;
      const seq=r.paradas.map((p,i)=>({p,ent:i+1})); if(carr) seq.reverse();
      /* folha de resumo da rota */
      let pg=null,y=0; const linha=(txt,x,sz,f,cor)=>pg.drawText(latin(txt),{x,y,size:sz,font:f||F,color:cor||rgb(0,0,0)});
      const nova=()=>{ pg=out.addPage([595.28,841.89]); y=800;
        linha("ROTA: "+r.nome,40,16,FB); y-=20;
        linha(`Separação na ordem de ${carr?"CARREGAMENTO (última entrega primeiro)":"ENTREGA (1ª entrega primeiro)"} · ${n} clientes · ${r.peds} pedidos · gerado ${pad(agora.getDate())}/${pad(agora.getMonth()+1)}/${agora.getFullYear()} ${pad(agora.getHours())}:${pad(agora.getMinutes())}`,40,9); y-=22;
        linha("Ordem",40,9,FB); linha("Entrega",80,9,FB); linha("Cliente",125,9,FB); linha("Cidade",345,9,FB); linha("Pedidos",450,9,FB); linha("Total R$",515,9,FB); y-=6;
        pg.drawLine({start:{x:40,y},end:{x:555,y},thickness:.6}); y-=13; };
      nova();
      seq.forEach(({p,ent},i)=>{ if(y<50) nova();
        linha(String(i+1),40,10,FB); linha(String(ent)+"ª",80,10); linha((p.cod?p.cod+" ":"")+(p.fant||p.nome||"").slice(0,38),125,10);
        linha((p.cid||"").slice(0,18),345,10); linha(p.peds.map(x=>x.num).join(", ").slice(0,14),450,9); linha(fmtN(p.total,2),515,10); y-=16; });
      y-=6; if(y<50) nova(); linha(`Total da rota: R$ ${fmtN(r.paradas.reduce((s,p)=>s+p.total,0),2)}`,40,11,FB);
      /* pedidos na ordem, com a etiqueta de posição */
      let pos=0;
      for(const {p,ent} of seq){ pos++;
        for(const ped of p.peds){ const pags=await out.copyPages(srcs[p.arq],ped.pags);
          pags.forEach(pp=>{ out.addPage(pp); const {width}=pp.getSize();
            const tag=latin(`${carr?`CARREGAR ${pos}º/${n} · entrega ${ent}ª`:`ENTREGA ${ent}ª/${n}`} · ${r.nome}`).slice(0,60);
            const w=Math.min(width-24,FB.widthOfTextAtSize(tag,9.5)+14);
            pp.drawRectangle({x:width-12-w,y:4,width:w,height:18,color:rgb(1,1,1),borderColor:rgb(0,0,0),borderWidth:.8});
            pp.drawText(tag,{x:width-12-w+7,y:9.5,size:9.5,font:FB}); }); } }
    }
    const bytes=await out.save(); if(sp.saida) URL.revokeObjectURL(sp.saida.url);
    sp.saida={url:URL.createObjectURL(new Blob([bytes],{type:"application/pdf"})),nome:`Separacao ${pad(agora.getDate())}-${pad(agora.getMonth()+1)}-${agora.getFullYear()} ${pad(agora.getHours())}h${pad(agora.getMinutes())}.pdf`,pags:out.getPageCount()};
  }catch(e){ toast("Não gerei o PDF: "+(e.message||e)); }
  sp.gerando=false; render();
}

    <div class="chips"><button data-a="sepPorRota" data-v="1" class="${sp?.porRota!==false?"on":""}">Separar por rota (pela cidade)</button><button data-a="sepPorRota" data-v="0" class="${sp?.porRota===false?"on":""}">Cada PDF é uma rota</button></div>
    <div class="small dim">Entrega: a 1ª entrega sai em cima. Carregamento: a última entrega sai em cima (é a primeira a entrar no caminhão).</div></div>`;

  const ambCard=sp.amb&&sp.amb.length?`<div class="card" style="margin-top:14px"><h3 style="margin-bottom:4px">Confira a rota destas cidades</h3><div class="small mut" style="margin-bottom:8px">Cidades que estão em mais de uma rota ou em nenhuma. ${falta?"<b style=\"color:var(--acc)\">Escolha a rota das marcadas para liberar a impressão.</b>":"O app já sugeriu pela rota das outras cidades do PDF."}</div>
    <div class="tbl"><table><tbody>${sp.amb.map(a=>`<tr><td><b>${esc(a.cid)}</b><div class="small mut">${a.n} cliente(s)${a.cand.length?" · rotas: "+esc(a.cand.join(", ")):" · não está em nenhuma rota"}</div></td>
      <td><select data-sep-esc="${esc(a.ck)}" style="${a.rota?"":"border-color:var(--acc)"}"><option value="">${a.rota?(a.semRota?"Rota própria ("+esc(a.cid)+")":"Sugestão: "+esc(a.rota)):"Escolha a rota…"}</option>
      ${[...a.cand,...nomesR.filter(n=>!a.cand.includes(n))].map(n=>`<option value="${esc(n)}" ${a.escolhida&&a.rota===n?"selected":""}>${esc(n)}${a.cand.includes(n)?" ★":""}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div></div>`:"";
  return ajuda+ambCard+(sp.rotas.length?`<div class="card row" style="margin-top:14px"><button class="pri" data-a="sepGerar" ${sp.gerando||falta?"disabled":""}>${sp.gerando?"Gerando…":"Gerar PDF para imprimir"}</button>
      ${sp.saida?`<a class="btn" href="${sp.saida.url}" target="_blank" rel="noopener">Abrir e imprimir (${sp.saida.pags} pág.)</a><a class="btn ghost" href="${sp.saida.url}" download="${esc(sp.saida.nome)}">Baixar PDF</a>`:""}</div>`:"")+
    sp.rotas.map((r,ri)=>{ const sem=r.paradas.filter(p=>p.gps==="n").length, nao=r.paradas.filter(p=>p.naoAchado).length;
      return `<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>${esc(r.nome)}</h3>
        <div class="row"><span class="small mut">${r.paradas.length} clientes · ${r.peds} pedidos · ${r.paginas} pág. · ${fmtN(r.kmDepois)} km (antes ${fmtN(r.kmAntes)} km)</span>
        <button class="mini" data-a="sepOtim" data-r="${ri}">Otimizar de novo</button><button class="mini" data-a="sepRota" data-r="${ri}">Levar para Roteirizar</button><button class="mini ghost" data-a="sepTira" data-r="${ri}" style="color:var(--bad)">✕</button></div></div>
        ${sem||nao?`<div class="note" style="margin-bottom:8px">${sem?`${sem} cliente(s) sem localização foram para o fim: ajuste com ▲▼. `:""}${nao?`${nao} cliente(s) não estão na base do app.`:""}</div>`:""}
        <div class="tbl"><table><thead><tr><th>#</th><th>Cliente</th><th>Local</th><th>Pedidos</th><th class="n">Total R$</th><th></th></tr></thead><tbody>
        ${r.paradas.map((p,i)=>`<tr><td class="num">${i+1}</td><td style="min-width:150px"><b>${esc(nomeCli(p))}</b><div class="small mut">${esc(p.cid)} · cód. ${esc(p.cod)} · ${p.itens} itens</div></td>
          <td><span class="gps ${p.gps}">${tagLoc[p.gps]||""}</span></td><td class="small">${p.peds.map(x=>esc(x.num)).join("<br>")}</td><td class="n num">${fmtN(p.total,2)}</td>
          <td style="white-space:nowrap"><button class="mini ghost" data-a="sepSobe" data-r="${ri}" data-i="${i}" aria-label="Subir">▲</button><button class="mini ghost" data-a="sepDesce" data-r="${ri}" data-i="${i}" aria-label="Descer">▼</button></td></tr>`).join("")}
        </tbody></table></div></div>`; }).join("");
}
function acaoSeparacao(a,el){
  const sp=S.sep, r=sp&&sp.rotas[Number(el.dataset.r)];
  if(a==="sepOrdem"){ if(!S.sep) S.sep={rotas:[],ordem:"entrega"}; S.sep.ordem=el.dataset.v; S.sep.saida=null; render(); return; }
  if(a==="sepGerar"){ gerarPdfSep(); return; }
  if(a==="sepPorRota"){ if(!S.sep) S.sep={rotas:[],ordem:"entrega"}; S.sep.porRota=el.dataset.v==="1"; if(S.sep.paradas){ S.sep.fora=[]; agruparSep(); } render(); return; }
  if(!r) return;
  if(a==="sepSobe"||a==="sepDesce"){ const i=Number(el.dataset.i), j=a==="sepSobe"?i-1:i+1; if(j<0||j>=r.paradas.length) return; [r.paradas[i],r.paradas[j]]=[r.paradas[j],r.paradas[i]]; r.kmDepois=custoRota(r.paradas); sp.saida=null; render(); return; }
  if(a==="sepOtim"){ r.paradas=otimizar(r.paradas); r.kmDepois=custoRota(r.paradas); sp.saida=null; render(); return; }
  if(a==="sepTira"){ sp.fora.push(r.nome); sp.rotas.splice(Number(el.dataset.r),1); sp.saida=null; render(); return; }
  if(a==="sepRota"){ S.rasc=[]; novaRota(hoje());
    S.ed.paradas=r.paradas.map(p=>{ const q={...p,k:uid(),valor:fmtN(p.total,2)}; delete q.peds; delete q.total; delete q.itens; delete q.naoAchado; delete q.arq; return q; });
    S.view="roteirizar"; render(); window.scrollTo(0,0); toast("Rota montada na ordem da separação. Escolha o caminhão e o motorista e salve."); return; }
}

/* ================= navegação e eventos ================= */
function render(){
  const app=$("#app"); montarAbas();
  if(S.view==="login"){ app.innerHTML=vLogin(); return; }
  if(S.view==="motorista") app.innerHTML=vMotorista();
  else if(S.view==="roteirizar"){ if(!S.ed) novaRota(); if(S.diaAtivo!==S.ed.data) carregarDia(S.ed.data); app.innerHTML=vRoteirizar(); }
  else if(S.view==="painel"||S.view==="canhotos"){ if(S.perAtivo!==S.periodo) carregarPeriodo(); app.innerHTML=S.view==="painel"?vPainel():vCanhotos(); }
  else if(S.view==="usuarios"){ if(!S.usrOk) carregarUsuarios(); app.innerHTML=vUsuarios(); }
  else if(S.view==="separacao"){ app.innerHTML=vSeparacao(); }
  pos();
}
document.addEventListener("click",ev=>{
  const tb=ev.target.closest("[data-tab]"); if(tb){ const v=tb.dataset.tab; if(v==="sair"){ sair(false); return; } S.view=v; render(); window.scrollTo(0,0); return; }
  const b=ev.target.closest("[data-a]"); if(!b) return; const a=b.dataset.a;
  if(a==="entrar"){ entrar(); return; }
  if(a==="demo"){ S.demo=!S.demo; render(); return; }
  if(a==="atualizarP"){ carregarPeriodo(); render(); return; }
  if(a==="ver"){ abrirFoto(b.dataset.r,b.dataset.k); return; }
  if(S.view==="motorista") acaoMotorista(a,b.dataset.k,b);
  else if(S.view==="roteirizar") acaoRoteirizar(a,b);
  else if(S.view==="usuarios") acaoUsuarios(a,b);
  else if(S.view==="separacao") acaoSeparacao(a,b);
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&S.view==="login"&&(ev.target.id==="lgPin"||ev.target.id==="lgUser")) entrar(); if(ev.key==="Escape") document.querySelector(".lb")?.remove(); });

document.addEventListener("toggle",ev=>{ if(ev.target.id==="fatBox") S.fatAberto=ev.target.open; },true);

  const t=ev.target;

  if(t.id==="edData"){ lerEd(); if(S.ed.id){ novaRota(t.value); } else S.ed.data=t.value; render(); }
  if(["edPlaca","edMot","edSaida"].includes(t.id)){ lerEd(); render(); }
  if(t.id==="sepArq"&&t.files&&t.files.length){ lerPdfsSep([...t.files]); }
  if(t.dataset.sepEsc!==undefined&&S.sep){ if(t.value) S.sep.escolha[t.dataset.sepEsc]=t.value; else delete S.sep.escolha[t.dataset.sepEsc]; agruparSep(); render(); }
  if(t.id==="fatDia"){ S.fatDia=t.value; S.fatAberto=true; render(); }
  if(t.id==="fPer"){ S.periodo=Number(t.value); render(); }

  if(t.id==="fMot"){ S.filt.mot=t.value; render(); }
});
setInterval(()=>{ if(!S.token) return; if(S.view==="motorista"&&!document.hidden) atualizarMinhas(); },90000);
// posição do caminhão para o mapa da gestão: a cada 2 min, só do motorista da rota em andamento (com o app aberto)
setInterval(()=>{ if(!S.token||!S.me) return; const g=posAtual(); const r=rotasHoje().find(x=>x.ini&&!x.fim&&x.mot===S.me.nome); if(!r||!g) return;
  S.fila=S.fila.filter(e=>!(e.tipo==="pos"&&e.rotaId===r.id)); const ev={id:uid(),tipo:"pos",rotaId:r.id,ts:new Date().toISOString(),gps:g};
  aplicarEvento(r,ev); S.fila.push(ev); salvarLocal(); sincronizar(); },120000);
boot().then(()=>{ window.__ok=true; }).catch(e=>{ $("#app").innerHTML=`<div class="card"><b>Erro ao abrir o app:</b> ${esc(e&&e.message||e)}</div>`; });
